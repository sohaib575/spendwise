<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>SpendWise – Dashboard</title></head><body data-page="dashboard">
<div id="sidebar"></div><div class="main"><header id="topbar"></header><main class="content">
<h1 class="pt" data-i18n="dash_title"></h1>
<div class="row g-3 mb-3">
 <div class="col-6 col-xl-3"><div class="card-sw stat"><div class="ic"><i class="bi bi-arrow-down-left"></i></div><div><small data-i18n="income"></small><b id="sIncome"></b></div></div></div>
 <div class="col-6 col-xl-3"><div class="card-sw stat"><div class="ic"><i class="bi bi-arrow-up-right"></i></div><div><small data-i18n="expenses"></small><b id="sExpense"></b></div></div></div>
 <div class="col-6 col-xl-3"><div class="card-sw stat hero"><div class="ic"><i class="bi bi-wallet2"></i></div><div><small data-i18n="balance"></small><b id="sBalance"></b></div></div></div>
 <div class="col-6 col-xl-3"><div class="card-sw stat"><div class="ic"><i class="bi bi-piggy-bank"></i></div><div><small data-i18n="savings"></small><b id="sSaved"></b></div></div></div>
</div>
<div class="row g-3 mb-3">
 <div class="col-lg-8"><div class="card-sw"><h2 data-i18n="month_chart"></h2><div class="chart-box"><canvas id="barChart"></canvas></div></div></div>
 <div class="col-lg-4"><div class="card-sw"><h2 data-i18n="cat_chart"></h2><div class="chart-box"><canvas id="pieChart"></canvas></div></div></div>
</div>
<div class="row g-3 mb-3">
 <div class="col-lg-5"><div class="card-sw"><h2 data-i18n="budget_prog"></h2><div id="budgetBox"></div></div></div>
 <div class="col-lg-7"><div class="card-sw"><h2 data-i18n="tips_title"></h2><div id="tips"></div></div></div>
</div>
<div class="card-sw"><div class="d-flex justify-content-between"><h2 data-i18n="recent"></h2><a href="transactions.html" data-i18n="view_all"></a></div>
 <div class="table-responsive"><table class="tbl tx"><tbody id="recent"></tbody></table></div></div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script src="js/app.js"></script><script src="js/dashboard.js"></script><script type="module" src="js/firebase/firebase-bridge.js"></script></body></html>
