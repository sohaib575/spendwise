<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>SpendWise – Budget</title></head><body data-page="budget">
<div id="sidebar"></div><div class="main"><header id="topbar"></header><main class="content">
<h1 class="pt" data-i18n="budget_title"></h1>
<div class="row g-3"><div class="col-lg-5"><div class="card-sw"><form id="bForm" novalidate>
 <label class="form-label" data-i18n="monthly_budget"></label><input class="form-control" id="bMonthly" type="number" min="0" step="any"><span class="ferr" id="bErr"></span>
 <h2 class="mt-3" data-i18n="cat_budgets"></h2><div id="bCats" class="row g-2"></div>
 <button class="btn-g mt-3" type="submit"><i class="bi bi-check2"></i><span data-i18n="save_budget"></span></button></form></div></div>
<div class="col-lg-7"><div class="card-sw"><h2 data-i18n="progress"></h2><div id="bProg"></div></div></div></div>
</main></div>
<script src="js/app.js"></script>
<script>
/* Budget page: save budgets and show progress for the current month */
const bf = $('bForm');
bf.querySelector('#bCats').innerHTML = CATS.map(c => '<div class="col-6"><label class="form-label small" data-i18n="cat_'+c+'"></label><input class="form-control" type="number" min="0" step="any" data-cat="'+c+'"></div>').join('');
function load(){ const b = DB.budget(); $('bMonthly').value = b.monthly || ''; bf.querySelectorAll('[data-cat]').forEach(i => i.value = b.cats[i.dataset.cat] || ''); }
function row(label, spent, limit){
  const p = spent / limit * 100;
  return '<div class="mb-3"><div class="d-flex justify-content-between"><b>'+label+'</b><span>'+fmt(spent)+' '+t('of')+' '+fmt(limit)+'</span></div><div class="bar"><i class="'+barClass(p)+'" style="width:'+Math.min(p,100)+'%"></i></div>'+
    (p > 100 ? '<div class="note bad">'+t('exceeded',{n:fmt(spent-limit)})+'</div>' : p >= 80 ? '<div class="note warn">'+t('warn80',{p:Math.round(p)})+'</div>' : '')+'</div>';
}
function draw(){
  const b = DB.budget(), exp = DB.tx().filter(x => x.type === 'expense' && x.date.startsWith(thisMonth())); let h = '';
  if (b.monthly) h += row(t('budget_prog'), sum(exp), b.monthly);
  CATS.forEach(c => { if (b.cats[c]) h += row(t('cat_'+c), sum(exp.filter(x => x.category === c)), b.cats[c]); });
  $('bProg').innerHTML = h || '<p class="empty">'+t('no_budget')+'</p>';
}
bf.onsubmit = async e => {
  e.preventDefault(); const nums = [$('bMonthly'), ...bf.querySelectorAll('[data-cat]')];
  if (nums.some(i => i.value !== '' && !(parseFloat(i.value) >= 0))){ $('bErr').textContent = t('e_neg'); return; }
  $('bErr').textContent = ''; const cats = {};
  bf.querySelectorAll('[data-cat]').forEach(i => { if (parseFloat(i.value) > 0) cats[i.dataset.cat] = parseFloat(i.value); });
  try { await DB.saveBudget({monthly: parseFloat($('bMonthly').value) || 0, cats}); } catch (err) { $('bErr').textContent = err.message; return; }
  toast(t('saved')); draw();
};
load(); document.addEventListener('langchange', draw);
</script><script type="module" src="js/firebase/firebase-bridge.js"></script></body></html>
