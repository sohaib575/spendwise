<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>SpendWise – Transactions</title></head><body data-page="transactions">
<div id="sidebar"></div><div class="main"><header id="topbar"></header><main class="content">
<h1 class="pt" data-i18n="tx_title"></h1>
<div class="card-sw mb-3"><h2 id="formTitle" data-i18n="add_tx"></h2>
<form id="txForm" novalidate><div class="row g-3">
 <div class="col-md-6"><label class="form-label" data-i18n="title"></label><input class="form-control" name="ttl" required maxlength="60"><div class="invalid-feedback" data-i18n="e_req"></div></div>
 <div class="col-md-6"><label class="form-label" data-i18n="amount"></label><input class="form-control" name="amount" type="number" min="0.01" step="any" required><div class="invalid-feedback" data-i18n="e_amt"></div></div>
 <div class="col-md-4"><label class="form-label" data-i18n="type"></label><select class="form-select" name="type"><option value="expense" data-i18n="t_expense"></option><option value="income" data-i18n="t_income"></option></select></div>
 <div class="col-md-4"><label class="form-label" data-i18n="category"></label><select class="form-select" name="category" required></select></div>
 <div class="col-md-4"><label class="form-label" data-i18n="date"></label><input class="form-control" name="date" type="date" required><div class="invalid-feedback" data-i18n="e_req"></div></div>
 <div class="col-12"><label class="form-label" data-i18n="desc"></label><textarea class="form-control" name="description" rows="2" maxlength="200"></textarea></div>
 <div class="col-12 d-flex gap-2"><button class="btn-g" id="saveBtn" type="submit"><i class="bi bi-plus-lg"></i><span data-i18n="add_tx"></span></button><button class="btn-soft d-none" id="cancelEdit" type="button" data-i18n="cancel"></button></div>
</div></form></div>
<div class="card-sw"><h2 data-i18n="history"></h2>
 <div class="row g-2 mb-3"><div class="col-md-4"><input id="fSearch" class="form-control" data-i18n-ph="search"></div>
 <div class="col-md-3"><select id="fCat" class="form-select"></select></div><div class="col-md-3"><input id="fDate" type="date" class="form-control"></div>
 <div class="col-md-2"><button id="fClear" class="btn-soft w-100 justify-content-center" data-i18n="clear"></button></div></div>
 <div class="table-responsive"><table class="tbl tx"><thead><tr><th data-i18n="date"></th><th data-i18n="title"></th><th data-i18n="category"></th><th data-i18n="amount"></th><th data-i18n="actions"></th></tr></thead><tbody id="txBody"></tbody></table></div></div>
</main></div>
<script src="js/app.js"></script><script src="js/transactions.js"></script><script type="module" src="js/firebase/firebase-bridge.js"></script></body></html>
