<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>SpendWise – login</title></head><body>
<div class="auth-wrap"><div class="auth-card">
 <div class="d-flex justify-content-between align-items-center mb-3"><a class="brand" style="color:var(--ink);margin:0" href="index.html"><i class="bi bi-wallet2"></i>SpendWise</a><span class="d-flex gap-2"><button class="btn-soft theme-btn" aria-label="Theme"></button><button class="btn-soft lang-btn"></button></span></div>
 <h1 class="h4 fw-bold mb-3" data-i18n="login_title"></h1>
 <form id="authForm" data-mode="login" novalidate>
  
  <label class="form-label" data-i18n="email"></label><input class="form-control" name="email" type="email" autocomplete="email"><span class="ferr" data-err="email"></span>
  <label class="form-label mt-2" data-i18n="password"></label><div class="pw"><input class="form-control" name="password" type="password"><button type="button" class="pw-toggle" aria-label="Show or hide password"><i class="bi bi-eye"></i></button></div><span class="ferr" data-err="password"></span>
  <div style="text-align:end"><a href="#" id="forgotLink" data-i18n="forgot"></a></div><span class="ferr" id="resetMsg" role="status"></span>
  
  <button class="btn-g w-100 justify-content-center mt-3" type="submit" data-i18n="login"></button>
 </form>
 <p class="mt-3 mb-0 text-center"><span class="text-secondary" data-i18n="no_account"></span> <a href="signup.html" data-i18n="signup"></a></p>
</div></div><script src="js/app.js"></script><script type="module" src="js/firebase/firebase-bridge.js"></script></body></html>
